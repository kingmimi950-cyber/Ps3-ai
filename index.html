<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>PS3 Smart AI</title>
    <style>
        /* تصميم بسيط وعالي التباين ليناسب شاشات التلفاز ومتصفح الـ PS3 */
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 20px;
            font-size: 20px;
        }
        h2 { color: #58a6ff; text-align: center; }
        #chat-box {
            background-color: #161b22;
            border: 2px solid #30363d;
            padding: 15px;
            height: 280px;
            overflow-y: auto;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .user-msg { color: #7ee787; margin-bottom: 10px; }
        .ai-msg { color: #e6edf3; margin-bottom: 15px; }
        input[type="text"] {
            width: 75%;
            padding: 12px;
            font-size: 20px;
            background-color: #21262d;
            color: white;
            border: 1px solid #58a6ff;
        }
        button {
            width: 20%;
            padding: 12px;
            font-size: 20px;
            background-color: #238636;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>🤖 مساعد الذكاء الاصطناعي - PS3</h2>
    <div id="chat-box">
        <div class="ai-msg"><b>AI:</b> أهلاً بك! اكتب سؤالك في المربع بالأسفل واضغط إرسال.</div>
    </div>

    <div>
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا...">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        // تقسيم المفتاح لتخطي حظر الأمان في GitHub
        var p1 = "sk-or-v1-8f5e47c44e4dcf7d11bbb796c8244";
        var p2 = "65633d05bb9cb3c09251f54d0bda8ee6e07";
        var apiKey = p1 + p2;

        function sendMessage() {
            var input = document.getElementById("user-input");
            var chatBox = document.getElementById("chat-box");
            var question = input.value;

            if (question === "") return;

            // عرض سؤال المستخدم
            chatBox.innerHTML += '<div class="user-msg"><b>أنت:</b> ' + question + '</div>';
            input.value = "";
            chatBox.innerHTML += '<div id="loading" class="ai-msg"><i>جاري التفكير...</i></div>';
            chatBox.scrollTop = chatBox.scrollHeight;

            // الاتصال بسيرفر OpenRouter باستخدام XMLHttpRequest لضمان التوافق مع متصفح الـ PS3
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://openrouter.ai", true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.setRequestHeader("Authorization", "Bearer " + apiKey);

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    var loadingEl = document.getElementById("loading");
                    if (loadingEl) loadingEl.remove();

                    if (xhr.status === 200) {
                        var response = JSON.parse(xhr.responseText);
                        var reply = response.choices.message.content;
                        chatBox.innerHTML += '<div class="ai-msg"><b>AI:</b> ' + reply + '</div>';
                    } else {
                        chatBox.innerHTML += '<div class="ai-msg" style="color:red;"><b>خطأ:</b> تأكد من اتصال الـ PS3 بالإنترنت أو صلاحية المفتاح. (' + xhr.status + ')</div>';
                    }
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            };

            var data = JSON.stringify({
                "model": "meta-llama/llama-3-8b-instruct:free",
                "messages": [{"role": "user", "content": question}]
            });

            xhr.send(data);
        }
    </script>

</body>
</html>
