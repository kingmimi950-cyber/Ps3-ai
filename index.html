<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>PS3 Smart AI</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 15px;
            font-size: 22px;
        }
        h2 {
            color: #58a6ff;
            text-align: center;
            margin-bottom: 10px;
        }
        #chat-box {
            background-color: #161b22;
            border: 2px solid #30363d;
            padding: 15px;
            height: 260px;
            overflow-y: auto;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .user-msg { color: #7ee787; margin-bottom: 12px; }
        .ai-msg { color: #ffffff; margin-bottom: 15px; }
        .err-msg { color: #ff7b72; margin-bottom: 15px; }
        input[type="text"] {
            width: 72%;
            padding: 12px;
            font-size: 20px;
            background-color: #21262d;
            color: #ffffff;
            border: 2px solid #58a6ff;
        }
        button {
            width: 22%;
            padding: 12px;
            font-size: 20px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>مساعد الذكاء الاصطناعي - PS3</h2>
    <div id="chat-box">
        <div class="ai-msg"><b>AI:</b> أهلاً بك! اضغط على المربع بالأسفل واكتب سؤالك بالكنترولر.</div>
    </div>

    <div>
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا...">
        <button type="button" onclick="sendMessage()">إرسال</button>
    </div>

    <script type="text/javascript">
        var p1 = "sk-or-v1-8f5e47c44e4dcf7d11bbb796c8244";
        var p2 = "65633d05bb9cb3c09251f54d0bda8ee6e07";
        var apiKey = p1 + p2;

        function sendMessage() {
            var input = document.getElementById("user-input");
            var chatBox = document.getElementById("chat-box");
            var question = input.value;

            if (!question || question === "") {
                return;
            }

            chatBox.innerHTML += '<div class="user-msg"><b>أنت:</b> ' + question + '</div>';
            input.value = "";
            chatBox.innerHTML += '<div id="loading" class="ai-msg"><i>جاري الاتصال بالذكاء الاصطناعي...</i></div>';
            chatBox.scrollTop = chatBox.scrollHeight;

            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://openrouter.ai", true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.setRequestHeader("Authorization", "Bearer " + apiKey);

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    var loadingEl = document.getElementById("loading");
                    if (loadingEl && loadingEl.parentNode) {
                        loadingEl.parentNode.removeChild(loadingEl);
                    }

                    if (xhr.status === 200) {
                        try {
                            var response = JSON.parse(xhr.responseText);
                            var reply = response.choices[0].message.content;
                            reply = reply.replace(/\n/g, "<br>");
                            chatBox.innerHTML += '<div class="ai-msg"><b>AI:</b> ' + reply + '</div>';
                        } catch (e) {
                            chatBox.innerHTML += '<div class="err-msg"><b>خطأ في قراءة الرد:</b> ' + e.message + '</div>';
                        }
                    } else {
                        chatBox.innerHTML += '<div class="err-msg"><b>خطأ اتصال (' + xhr.status + '):</b> تأكد من الإنترنت أو إعدادات SSL في المتصفح.</div>';
                    }
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            };

            var payload = '{"model":"meta-llama/llama-3-8b-instruct:free","messages":[{"role":"user","content":' + JSON.stringify(question) + '}]}';
            xhr.send(payload);
        }
    </script>

</body>
</html>
