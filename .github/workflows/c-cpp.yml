
name: PS3 AI - Build PKG

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PS3DEV
        run: |
          git clone --depth 1 https://github.com/ps3dev/ps3dev-docker.git /tmp/ps3dev-docker
          docker build -t ps3dev-docker /tmp/ps3dev-docker

      - name: Build PS3 PKG
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/build" \
            -w /build \
            ps3dev-docker make pkg
          test -s PS3_AI.pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS3_AI-PKG
          path: PS3_AI.pkg
