name: Build PS3 AI App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_pkg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip make
          # تحميل أداة بناء حزم البلايستيشن 3 الحديثة المتوافقة مع السيرفر
          pip3 install git+https://github.com --break-system-packages || pip3 install git+https://github.com

      - name: Create PS3 App Files
        run: |
          # إنشاء كود برمجائي بسيط
          cat << 'EOF' > main.c
          #include <stdio.h>
          int main() {
              printf("PS3 AI Client Initialized\n");
              return 0;
          }
          EOF

          # إنشاء ملف إعدادات الحزمة للبلايستيشن
          cat << 'EOF' > package.conf
          ContentID = UP0001-AI0000001_00-0000000000000000
          EOF

      - name: Compile and Pack PS3 PKG
        run: |
          # بناء ملف التشغيل
          gcc -O2 main.c -o EBOOT.BIN
          # تحويله إلى حزمة PKG جاهزة للبلايستيشن 3
          pkg-packager --content-id UP0001-AI0000001_00-0000000000000000 EBOOT.BIN ps3_ai_app.pkg

      - name: Upload PKG Product
        uses: actions/upload-artifact@v4
        with:
          name: PS3-AI-App
          path: ./*.pkg
